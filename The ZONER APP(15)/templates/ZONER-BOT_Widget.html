<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZONER-BOT Widget</title>
  <style>
    body {
      background: #0b0f17; color: #e6edf7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 12px; margin: 0; font-size: 12px;
    }
    .card { background: #121826; border: 1px solid #243047; border-radius: 10px; padding: 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .pills { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
    .pill {
      background: #182032; color: #8b9bb4; border: 1px solid #243047;
      padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer;
    }
    .pill.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
    .btn { border: none; border-radius: 6px; padding: 6px 10px; font-size: 11px; font-weight: 600; cursor: pointer; color: #fff; }
    .pos { color: #22c55e; } .neg { color: #ef4444; }
  </style>
</head>
<body>
  <div class="card">
    <div class="row">
      <strong>ZONER-BOT</strong>
      <span id="wSpot">$--</span>
    </div>
    <div class="row">
      <span>Bankroll: <strong id="wBankroll">$--</strong></span>
      <span>PnL: <strong id="wPnl">$0.00</strong></span>
    </div>
    <div class="pills" id="wTf">
      <button class="pill" data-tf="5m" onclick="setTf('5m')">5m</button>
      <button class="pill" data-tf="15m" onclick="setTf('15m')">15m</button>
      <button class="pill" data-tf="1h" onclick="setTf('1h')">1h</button>
      <button class="pill" data-tf="1d" onclick="setTf('1d')">1d</button>
      <button class="pill" data-tf="all" onclick="setTf('all')">All</button>
    </div>
    <div class="row">
      <span>Profile: <strong id="wProf">--</strong></span>
      <span>Open: <strong id="wOpen">0</strong></span>
    </div>
    <div style="font-size:11px;color:#8b9bb4;margin-bottom:8px;" id="wSig">--</div>
    <div class="row" style="margin-bottom:0;">
      <button class="btn" style="background:#3b82f6;" onclick="sync()">Sync</button>
      <button class="btn" style="background:#ef4444;" onclick="cashAll()">Cash Out All</button>
    </div>
  </div>
<script>
async function refresh() {
  try {
    const r = await fetch('/api/state');
    const d = await r.json();
    if (!d.ok) return;
    document.getElementById('wSpot').textContent = d.spot_price ? '$' + d.spot_price.toLocaleString() : '$--';
    document.getElementById('wBankroll').textContent = d.bankroll_usd !== null ? '$' + Number(d.bankroll_usd).toFixed(2) : 'Paper';
    const pnl = document.getElementById('wPnl');
    pnl.textContent = (d.daily_pnl >= 0 ? '+$' : '-$') + Math.abs(d.daily_pnl).toFixed(2);
    pnl.className = d.daily_pnl >= 0 ? 'pos' : 'neg';
    document.getElementById('wProf').textContent = d.config.risk_profile;
    document.getElementById('wOpen').textContent = d.open_count;
    document.getElementById('wSig').textContent = `${d.signal?.direction || '--'} (${Math.round((d.signal?.score||0)*100)}%) — ${d.signal?.reason || ''}`;
    document.querySelectorAll('#wTf .pill').forEach(b => b.classList.toggle('active', b.dataset.tf === d.config.target_timeframe));
  } catch(e) {}
}
async function setTf(tf) {
  await fetch('/api/config', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({target_timeframe: tf})});
  refresh();
}
async function sync() { await fetch('/api/sync-bankroll', {method:'POST'}); refresh(); }
async function cashAll() { await fetch('/api/cash-out-all', {method:'POST'}); refresh(); }
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
