<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZONER-BOT Compact Widget</title>
  <style>
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f17; color: #e6edf7; padding: 12px;
    }
    .card {
      max-width: 420px; margin: 0 auto; background: #131a26; border: 1px solid #263147;
      border-radius: 14px; padding: 14px;
    }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
    .pill {
      padding: 3px 9px; border-radius: 999px; font-size: 0.74rem; font-weight: 700;
      background: #192233; border: 1px solid #263147;
    }
    .live { color: #22c55e; border-color: rgba(34,197,94,0.45); background: rgba(34,197,94,0.15); }
    .paper { color: #f59e0b; border-color: rgba(245,158,11,0.45); background: rgba(245,158,11,0.15); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
    .box { background: #192233; border: 1px solid #263147; border-radius: 8px; padding: 8px; }
    .lbl { font-size: 0.7rem; color: #93a4bd; text-transform: uppercase; }
    .val { font-size: 1rem; font-weight: 700; margin-top: 2px; }
    .btn {
      flex: 1; padding: 9px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; color: #fff;
    }
    .up { background: #16a34a; }
    .down { background: #dc2626; }
    .ai-strip {
      margin-top: 10px; padding: 9px 10px; border-radius: 9px;
      background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.35);
      font-size: 0.79rem; line-height: 1.38;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="row">
      <strong>ZONER-BOT</strong>
      <div>
        <span id="wMode" class="pill paper">PAPER</span>
        <span id="wApi" class="pill">API</span>
      </div>
    </div>
    <div class="grid">
      <div class="box"><div class="lbl">Cash</div><div class="val" id="wCash">$0.00</div></div>
      <div class="box"><div class="lbl">BTC</div><div class="val" id="wSpot">$0</div></div>
      <div class="box"><div class="lbl">P&amp;L</div><div class="val" id="wPnl">$0.00</div></div>
    </div>
    <div style="font-size:0.82rem; color:#cbd5e1; margin-bottom:10px;" id="wGate">Scanning...</div>
    <div class="row" style="margin-bottom:0;">
      <button class="btn up" onclick="wTrade('UP')">Buy UP</button>
      <button class="btn down" onclick="wTrade('DOWN')">Buy DOWN</button>
    </div>
    <div class="ai-strip">
      <div style="font-weight:700; color:#93c5fd;" id="wAiHead">AI Guide: Connecting...</div>
      <div style="color:#fde68a; margin-top:3px;" id="wAiTip"></div>
    </div>
  </div>
<script>
async function wTrade(side) {
  await fetch('/api/manual-trade', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({side}) });
  tick();
}
async function tick() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    const m = document.getElementById('wMode');
    m.textContent = d.config?.dry_run ? 'PAPER' : 'LIVE';
    m.className = 'pill ' + (d.config?.dry_run ? 'paper' : 'live');
    document.getElementById('wApi').textContent = d.account?.connected ? 'CONNECTED' : 'NO API';
    document.getElementById('wCash').textContent = '$' + Number(d.account?.cash_usd || 0).toFixed(2);
    document.getElementById('wSpot').textContent = '$' + Math.round(d.spot || 0).toLocaleString();
    const pnl = Number(d.metrics?.net_pnl || 0);
    document.getElementById('wPnl').textContent = (pnl >= 0 ? '+$' : '-$') + Math.abs(pnl).toFixed(2);
    document.getElementById('wGate').textContent = d.gate?.reason || 'Scanning...';
    document.getElementById('wAiHead').textContent = 'AI Guide: ' + (d.ai_briefing?.headline || '');
    document.getElementById('wAiTip').textContent = d.ai_briefing?.guidance || '';
  } catch (e) {}
}
tick();
setInterval(tick, 3000);
</script>
</body>
</html>
